name = "guanka-cf"
main = "src/worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ── 公网入口 ──────────────────────────────────────────────────────────
# 关掉 workers.dev 与预览 URL。这两个域名属于 Cloudflare 自己的 zone，
# **Cloudflare Access 无法为它们建应用**（Access 只能保护你账号下 zone 里的主机名）。
# 开着它们，等于在 Access 之外留了一扇永远不锁的门。
workers_dev = false
preview_urls = false

# 绑定自有域名（必须已在本账号托管）。
# custom_domain = true 时 wrangler 会自动创建 DNS 记录并签发证书，无需手工加 CNAME。
# 注意：workers_dev=false 且不配 routes 时，Worker 会部署成功但没有任何入口。
routes = [{ pattern = "card.agaj.eu.org", custom_domain = true }]

# 前端 SPA：静态资源由 Workers Assets 托管（自动 ETag / 304 / gzip / brotli）
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Worker 先行：/api/* 必须经过鉴权守卫
run_worker_first = true

# 单实例 Durable Object：全部业务状态与**会话表**集中一处，
# 读-改-写串行化，等价单线程语义；会话表因此不需要额外的存储服务。
[[durable_objects.bindings]]
name = "GUANKA_DO"
class_name = "GuankaDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GuankaDO"]

# 提醒调度：每天 09:00 北京时间 跑一次（Cloudflare cron 用 UTC，中国无夏令时，
# 固定 UTC+8 → 01:00 UTC）。一轮把当天所有该提醒的项一起推，一天只推这一次。
# 改时间只需改这里：北京时间 08:00 = `0 0 * * *`，21:00 = `0 13 * * *`。
[triggers]
crons = ["0 1 * * *"]

# ─────────────────────────────────────────────────────────────
# 部署前必须设置主令牌（不要写进本文件！本文件进版本库）：
#   openssl rand -base64 32 | wrangler secret put AUTH_TOKEN
#
# 主令牌只用于登录，不会下发到浏览器：登录成功后签发的是一张独立的
# 随机会话 Cookie，可单独吊销，也可以「全部设备下线」。
#
# ── Cloudflare Access 信任模式（可选，开启后打开页面不再输令牌）──
# 两个值必须**同时**提供，缺一个就整体禁用（不会退化成「只看请求头有没有值」）：
#   ACCESS_TEAM_DOMAIN = 你的团队域名，形如 yourteam.cloudflareaccess.com
#                        （在 Access → Settings → 能看到，别带 https://）
#   ACCESS_AUD         = 该应用的 Application Audience (AUD) Tag
#                        （Access → Access → 你的应用 → Overview 里那串 64 位十六进制）
#
# 这两个都不是机密：AUD 本来就写在每个签发的 JWT 里。所以放 [vars] 也能接受，
# 想不把它写进仓库就用 secret put。
#
# [vars]
# ACCESS_TEAM_DOMAIN = "yourteam.cloudflareaccess.com"
# ACCESS_AUD = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
#
# 开启后：浏览器请求带的 Cf-Access-Jwt-Assertion 验签通过即视为已认证，
# 不再弹令牌框；AUTH_TOKEN 退化为纯 API / 日历订阅用途。
# 注意 workers.dev 与预览 URL 已在上面关掉——Access 保护不到它们，
# 那两条路只能靠 AUTH_TOKEN，所以 AUTH_TOKEN 建议保留。
#
# 可选：推送端点覆盖
# [vars]
# NOTIFY_BARK_URL = "https://api.day.app"

# ── Cloudflare Access 信任模式 ─────────────────────────────────
# 由 scripts/setup-access.mjs 写入；AUD 本来就写在每个签发的 JWT 里，不算机密。
[vars]
ACCESS_TEAM_DOMAIN = "agaj.cloudflareaccess.com"
ACCESS_AUD = "d66b7d55897fb5265c0561d4d89bcd4e11d38c69c77b560723defbe7d7135a91"